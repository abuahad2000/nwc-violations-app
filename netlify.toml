# Build configuration only. See docs/NETLIFY_AR.md for runtime prerequisites.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# This existing site was configured as a static site. Explicitly enable the
# Next.js adapter so server routes and public assets are deployed correctly.
[[plugins]]
  package = "@netlify/plugin-nextjs"
