services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [nwc_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis_prod_data:/data]
    networks: [nwc_private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]

  backend:
    build:
      context: ./infra/backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: https://${PUBLIC_DOMAIN}
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose: ["8000"]
    networks: [nwc_private]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_URL: http://backend:8000
    expose: ["3000"]
    networks: [nwc_private]
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_VARS: "$$PUBLIC_DOMAIN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/certbot/www:/var/www/certbot:ro
      - ./infra/nginx/letsencrypt:/etc/letsencrypt:ro
    networks: [nwc_private]
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_healthy }

  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    profiles: [tiles]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    expose: ["7800"]
    networks: [nwc_private]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_prod_data:
  redis_prod_data:
networks:
  nwc_private:
    driver: bridge
