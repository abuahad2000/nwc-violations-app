map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name ${PUBLIC_DOMAIN};
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name ${PUBLIC_DOMAIN};
  ssl_certificate /etc/letsencrypt/live/${PUBLIC_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  client_max_body_size 50m;
  location /_next/static/ { proxy_pass http://frontend:3000; expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; }
  location = /health { proxy_pass http://backend:8000/health; proxy_set_header Host $host; }
  location = /metrics { proxy_pass http://backend:8000/metrics; proxy_set_header Host $host; }
  location = /api/test/health { proxy_pass http://backend:8000/api/test/health; proxy_set_header Host $host; }
  location /api/ { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
}
